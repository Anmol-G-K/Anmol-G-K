name: isometric commit calendar (D)

on:
  schedule:
    # daily 00:00 UTC == 05:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# serialise with the other workflow that commits to the default branch
concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    name: generate-isocalendar
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # add a METRICS_TOKEN secret (PAT with read:user + repo) to include private activity;
          # without it the built-in token is used and public activity only is rendered
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Anmol-G-K
          filename: metrics.plugin.isocalendar.fullyear.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

name: 3D contribution calendar (A)

on:
  schedule:
    # daily 18:00 UTC == 23:30 IST; shift the hour if you want a different local time
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# serialise with the other workflow that commits to the default branch
concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      # pinned to v0.9.3; upstream documents @latest if you prefer auto-updates
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit and push generated SVGs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: regenerate 3D contribution calendar"; then
            git push
          fi
